name: Correction
description: A wrong number, a broken link or a misread source.
labels: ["kind:correction"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A link or a path, with the section or line if you have it.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Where the right figure or reading comes from, if there is one.
