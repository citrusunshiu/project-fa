# The component catalog: the source of truth for what exists and how real it is.
# tools/check_catalog.py checks this file against the docs and the code on every change.
#
# status:   planned  - accepted into the design
#           proposed - under review; needs a design doc once accepted
#           optional - may be added later
# fidelity: F0 paper, F1 simulated, F2 real path, F3 hardened (docs/charter.md)
# target:   the phase in which the component reaches the given fidelity

schema: 1

# The roadmap phase the repository is in (docs/charter.md#roadmap).
# During Phase 0, planned components without a design doc are reported as pending, not as errors.
phase: 0

languages: [go, python, java, csharp, rust, cpp, c, typescript, kotlin, swift]

lines:
  marketplace: Local marketplace with delivery, the first business line
  platform: The shared internal platform
  harness: The test harness that sits beside the system under test
  lab: The lab track

